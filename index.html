 if(!S.gid)return '<div class="card"><h2 style="margin-top:0">友達とつながる</h2><p class="sub">勉強中かどうか、今日の勉強時間、順位が共有されます。</p><button class="go" data-mk="1">グループを作る</button><p></p><button class="go stop" data-jn="1">コードで参加する</button>'+err()+'</div>';
 const all=Object.keys(mem).sort((a,b)=>(mem[a].joined||0)-(mem[b].joined||0)||(a<b?-1:1)),col={};all.forEach((i,n)=>col[i]="hsl("+Math.round(n*137.5%360)+" 62% 52%)");
 const vis=all.filter(i=>!mem[i].left),shown=vis.filter(i=>!mem[i].hide),secret=vis.filter(i=>mem[i].hide);
 const sec=i=>(mem[i].totalSec||0)+la(mem[i]),T=all.reduce((a,i)=>a+sec(i),0),h=T/3600,L=LG,E=EM;
 let lv=0;L.forEach((x,i)=>{if(h>=x)lv=i});const nx=L[lv+1],pc=nx?(h-L[lv])/(nx-L[lv])*100:100;
 const oth=all.filter(i=>mem[i].left||mem[i].hide).reduce((a,i)=>a+sec(i),0),seg=shown.map(i=>[mem[i].nick||"?",sec(i),col[i]]);if(oth)seg.push(["ほか",oth,"var(--ln)"]);
 const P=S.rm=="p",score=i=>tds(mem[i])/(P?(mem[i].goal||30)*60:1),md=["🥇","🥈","🥉"];
 const rk=shown.slice().sort((a,b)=>score(b)-score(a)||(mem[a].nick||"").localeCompare(mem[b].nick||""));
 const cb=i=>i==uid?'<span class="sub">応援 '+(mem[i].cheers||0)+'</span>':(S.chd&&S.chd[i]==key()?'<button class="chip" disabled>済</button>':'<button class="chip" data-ch="'+esc(i)+'">👏</button>');
 const row=(i,n,hid)=>{const m=mem[i],t=tds(m),dn=m.todayKey==key()&&(m.todaySec||0)>=m.goal*60;
  return '<div class="mm"><span class="rk">'+(hid||t<=0?"":md[n]||n+1)+'</span><u class="dot" style="background:'+col[i]+'"></u><b>'+esc(m.nick||"?")+(i==uid?"(あなた)":"")+'</b><span class="sub">'+(live(m)?"📖勉強中":isOn(m)?"🟢使用中":dn?"✅":"")+'</span><span class="val">'+(hid?"非公開":P?Math.round(t/((m.goal||30)*60)*100)+"%":Math.floor(t/60)+"分")+'</span>'+cb(i)+'</div>'};
 return '<div class="card"><div style="font-size:56px;text-align:center">'+E[lv]+'</div><p class="sub" style="text-align:center">みんなの島 Lv.'+(lv+1)+" "+TT[lv]+(nx?" / 次まで あと"+Math.ceil((nx-h)*10)/10+"時間":" / 最大!")+'</p><div class="bar"><i style="width:'+pc+'%"></i></div>'
 +'<div class="mtr">'+seg.map(x=>'<i style="width:'+(T?x[1]/T*100:0)+'%;background:'+x[2]+'"></i>').join("")+'</div><div class="lg">'+seg.map(x=>'<span><u style="background:'+x[2]+'"></u>'+esc(x[0])+" "+(T?Math.round(x[1]/T*100):0)+"%</span>").join("")+'</div></div>'
 +'<div class="card"><div class="chips" style="margin-top:0"><button class="chip'+(P?"":" on")+'" data-rm="t">今日の時間</button><button class="chip'+(P?" on":"")+'" data-rm="p">目標達成率</button></div>'
 +'<p class="sub" style="margin:0 0 6px">🟢 いまアプリを開いている人: '+vis.filter(i=>isOn(mem[i])||live(mem[i])).length+'人(勉強中 '+vis.filter(i=>live(mem[i])).length+'人)</p>'+rk.map((i,n)=>row(i,n,0)).join("")+secret.map(i=>row(i,0,1)).join("")
 +'<p class="sub">グループコード: <b>'+esc(S.gid)+'</b>(友達に送ろう)</p><button class="lnk" data-hd="1">自分の時間を'+(S.hide?"見せる(いま非公開)":"かくす(いま公開)")+'</button><button class="lnk" data-lv="1">グループを抜ける</button>'+err()+'</div>'}
let wl=null,ac=null;
function chime(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();[880,1320,1760].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.28;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+1);o.start(t);o.stop(t+1.1)});if(navigator.vibrate)navigator.vibrate([80,60,80])}catch(e){}}
async function wlock(){try{if(S.wl!==false&&S.run&&"wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){wl=null}}
function wrel(){if(wl){wl.release().catch(()=>{});wl=null}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"){wlock();cloudPull();ping(1)}else ping(0)});
if(S.run)wlock();
function ping(on){if(!db||!S.gid||!uid)return;db.doc("groups/"+S.gid+"/members/"+uid).set({onl:!!on,pAt:Date.now()},{merge:true}).catch(()=>{})}
addEventListener("pagehide",()=>ping(0));setInterval(()=>{if(document.visibilityState=="visible")ping(1)},18e4);
const isOn=m=>m.onl&&Date.now()-(m.pAt||0)<6e5;
function updBadge(){const n=tab=="b"||!S.gid?0:posts.filter(x=>x.at>(S.lastRead||0)&&x.uid!=uid).length,e=$("#bg");if(e){e.textContent=n>29?"30+":n;e.classList.toggle("on",n>0)}}
function pauseToggle(){if(!S.run)return;
 if(S.run.paused){S.run.t0=Date.now();S.run.lt=Date.now();S.run.paused=null;lastHb=Date.now();wlock()}
 else{const sec=el();if(sec>=1)commit(sec);S.run.paused=Date.now();wrel()}
 save();cloudSave();sync();draw()}
function tmf(t){const d=new Date(t);return(key(d)==key()?"":(d.getMonth()+1)+"/"+d.getDate()+" ")+pad(d.getHours())+":"+pad(d.getMinutes())}
function reportText(){const r=S.days[key()],f=x=>x>=60?Math.floor(x/60)+"時間"+(x%60?x%60+"分":""):x+"分";if(!r||r.sec<60)return"今日はこれから勉強します!💪";
 return"今日は"+f(Math.floor(r.sec/60))+"勉強したよ📚("+Object.entries(r.by||{}).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+" "+f(Math.floor(x[1]/60))).join("・")+")"+(ok(key())?" 目標達成!🎉":"")}
function postList(){if(!posts.length)return'<p class="sub">まだ投稿がありません。最初の報告をしてみよう!</p>';
 return posts.map(p=>'<div class="mm" style="align-items:flex-start"><div style="flex:1"><b>'+esc(p.nick||"?")+'</b> <span class="sub">'+tmf(p.at)+'</span><div style="white-space:pre-wrap;word-break:break-word">'+esc(p.text)+'</div></div>'+(p.uid==uid?'<button class="lnk" data-dp="'+esc(p.id)+'">✕</button>':'')+'</div>').join("")}
function brd(){if(!OKB||!S.gid)return'<div class="card"><h2 style="margin-top:0">掲示板</h2><p class="sub">「みんな」タブでグループに参加すると使えます。</p></div>';
 return'<div class="card"><h2 style="margin-top:0">みんなの掲示板 <span class="sub">グループ '+esc(S.gid)+'</span></h2><textarea id="pt" maxlength="140" rows="3" placeholder="今日やったことを報告しよう(140字まで)">'+esc(draftP)+'</textarea><div style="display:flex;gap:8px;align-items:center"><button class="chip" data-pi="1">今日の勉強を入れる</button><span style="flex:1"></span><button class="sm" style="margin:0" data-pp="1">投稿</button></div>'+err()+'</div><div class="card" id="pl">'+postList()+'</div>'}
function postsOn(){if(unsubP||!db||!S.gid)return;unsubP=db.collection("groups/"+S.gid+"/posts").orderBy("at","desc").limit(30).onSnapshot(q=>{posts=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.lastRead===undefined){S.lastRead=Date.now();save()}const l=$("#pl");if(tab=="b"){if(l)l.innerHTML=postList();S.lastRead=Date.now();save()}updBadge()},e=>{fbErr=e.message})}
function postsOff(){if(unsubP){unsubP();unsubP=null}}
$("#v").addEventListener("input",e=>{if(e.target.id=="pt")draftP=e.target.value});
function fxDraw(){let o=$("#fx");if(!(S.run&&S.run.fx)){if(o)o.remove();return}
 if(!o){o=document.createElement("div");o.id="fx";o.innerHTML='<div class="fxs"></div><div id="fxt" class="fxt">00:00</div><div class="fxbar"><i id="fxb"></i></div><div id="fxd" class="sub"></div><div class="fxbt"><button class="go" data-fp="1">⏸ 一時停止</button><button class="go stop" data-fe="1">おわる</button><button class="lnk" data-fq="1">もどる</button></div>';
  o.onclick=e=>{const d=e.target.dataset;if(d.fe)stop();if(d.fp)pauseToggle();if(d.fq){S.run.fx=false;save();draw()}};document.body.appendChild(o)}
 o.querySelector(".fxs").textContent=(S.subj[S.run.s]||"")+(S.run.paused?"・一時停止中":" に集中中");o.querySelector("[data-fp]").textContent=S.run.paused?"▶ 再開":"⏸ 一時停止"}
function fxUpd(e,t){const f=$("#fxt");if(!f||!S.run)return;f.textContent=fmt(S.run.acc+e);$("#fxd").textContent="今日 "+Math.floor(t/60)+"分 / 目標 "+S.goal+"分";$("#fxb").style.width=Math.min(100,t/(S.goal*60)*100)+"%"}
const isAcct=()=>acct&&!acct.isAnonymous,EM2=id=>id+"@study-island.invalid";
function cloudSave(){if(!db||!uid||!isAcct())return Promise.resolve();S.t=Date.now();const o=Object.assign({},S);delete o.run;save();return db.doc("users/"+uid).set({data:JSON.stringify(o),t:S.t}).catch(e=>{fbErr=e.message})}
async function cloudPull(){if(!db||!uid||!isAcct()||S.run)return;try{const d=await db.doc("users/"+uid).get();if(!d.exists)return;const c=d.data();
 if((c.t||0)>(S.t||0)){const o=JSON.parse(c.data);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,o);save();if(S.gid){await sync();listen()}draw()}}catch(e){}}
const emsg=e=>/invalid-credential|wrong-password|user-not-found/.test(e.code)?"IDかパスワードが違います":e.code=="auth/email-already-in-use"?"そのIDはすでに使われています":e.code=="auth/operation-not-allowed"?"Firebaseで「メール/パスワード」ログインがオフです":e.code=="auth/too-many-requests"?"試行が多すぎます。しばらく待ってね":(e.message||"エラー");
async function mkAcct(id,pw){if(!await fbInit())return"接続できません";
 try{await firebase.auth().currentUser.linkWithCredential(firebase.auth.EmailAuthProvider.credential(EM2(id),pw));acct=firebase.auth().currentUser;await cloudSave();return""}catch(e){return emsg(e)}}
async function login(id,pw){if(!await fbInit())return"接続できません";
 if(S.run)return"勉強中はログインできません";
 if(Object.keys(S.days).length&&!confirm("この端末の記録は、アカウントの記録に置き換わります。よろしいですか?"))return"やめました";
 if(S.gid&&uid&&acct.isAnonymous)await db.doc("groups/"+S.gid+"/members/"+uid).set({left:true,studying:false,runStart:null},{merge:true}).catch(()=>{});
 try{const c=await firebase.auth().signInWithEmailAndPassword(EM2(id),pw);uid=c.user.uid;acct=c.user;
  const d=await db.doc("users/"+uid).get();if(d.exists){const o=JSON.parse(d.data().data);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,o)}save();await cloudSave();location.reload();return""}
 catch(e){sync();return emsg(e)}}
async function logout(){if(S.run)return alert("勉強中はログアウトできません");await cloudSave();await firebase.auth().signOut();localStorage.removeItem(KEY);location.reload()}
function authForm(mk){const o=document.createElement("div");o.className="ov";
 o.innerHTML='<div class="card"><h2 style="margin-top:0">'+(mk?"アカウントを作る":"ログイン")+'</h2><p class="sub">'+(mk?"IDとパスワードだけ。メールアドレスは不要です。パスワードは忘れると復元できないので、メモしてね。":"作ったIDとパスワードを入力してね。")+'</p><input class="aid" placeholder="ID(英数字3〜20文字)" autocapitalize="off" autocomplete="username"><input class="apw" type="password" placeholder="パスワード(6文字以上)" autocomplete="'+(mk?"new-password":"current-password")+'"><p class="sub aer" style="color:#d9534f"></p><button class="sm aok">OK</button> <button class="lnk acx">やめる</button></div>';
 document.body.appendChild(o);const q=x=>o.querySelector(x);q(".acx").onclick=()=>o.remove();
 q(".aok").onclick=async()=>{const id=q(".aid").value.trim().toLowerCase(),pw=q(".apw").value,er=q(".aer");
  if(!/^[a-z0-9_.-]{3,20}$/.test(id))return er.textContent="IDは英数字と _ . - で3〜20文字";
  if(pw.length<6)return er.textContent="パスワードは6文字以上";
  er.textContent="処理中…";const r=await(mk?mkAcct(id,pw):login(id,pw));if(r)er.textContent=r;else{o.remove();draw()}}}
function acc(){if(!OKB)return"";
 return '<div class="card"><h2 style="margin-top:0">アカウント</h2>'+(isAcct()?'<p class="sub">ログイン中: <b>'+esc(acct.email.split("@")[0])+'</b><br>別の端末では「ログイン」から同じIDで使えます。</p><button class="lnk" data-lo="1">ログアウト</button>':'<p class="sub">アカウントを作ると、スマホとタブレットなど別の端末でも同じ記録で使えます。メールアドレスは不要で、IDとパスワードだけです。</p><button class="sm" data-ac="1">アカウントを作る</button> <button class="lnk" data-li="1">ログイン</button>')+'</div>'}
if(OKB)fbInit().then(async o=>{if(o){await cloudPull();if(S.gid){await sync();listen()}draw()}});

draw();
</script></body></html>
